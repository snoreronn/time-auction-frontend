<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Time Auction – Player</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body { margin:0; padding:0; height:100%; font-family:system-ui,sans-serif; background:#0b0b0b; color:#fff;}
  #screen { display:flex; align-items:center; justify-content:center; height:100%; text-align:center; }
  .big { font-size:2.2rem; font-weight:700; }
  .hint { font-size:1.2rem; opacity:0.8; }
  .hold { background:#1e1e1e; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .holding { background:#8b0000; }
  .countdown { font-size:4rem; font-weight:800; }
</style>
</head>
<body>
<div id="screen"></div>

<script>
const socket = io("https://time-auction-server-7ijf.onrender.com");
const screen = document.getElementById("screen");

let playerId = localStorage.getItem("timeAuctionPlayerId");
if(!playerId){
  playerId = Math.random().toString(36).substring(2,10);
  localStorage.setItem("timeAuctionPlayerId", playerId);
}

const name = prompt("Enter your name")||"Player";
socket.emit("join",{id:playerId,name});

let phase="lobby";
let holding=false;
let tappedIn=false;
let countdownInterval=null;

// ---------- RENDER ----------

function render(html){screen.innerHTML=html;}

function renderLobby(){
  phase="lobby";
  holding=false;
  tappedIn=false;
  render(`<div class="hint">Waiting for next round…</div>`);
}

function renderCountdown(endsAt){
  phase="countdown";
  tappedIn=false;
  holding=false;

  render(`
    <div id="holdArea" class="hold">
      <div class="big">Tap anywhere to join</div>
      <div id="countdown" class="countdown"></div>
    </div>
  `);

  const holdArea = document.getElementById("holdArea");

  // First tap anywhere = tap-in + start holding
  const startHolding = () => {
    if(tappedIn) return;
    tappedIn = true;
    holding = true;
    socket.emit("tap_in");
    socket.emit("hold_start");
    updateHoldVisual();
  };

  const updateHoldVisual = () => {
    holdArea.classList.toggle("holding", holding);
    holdArea.querySelector(".big").textContent = holding ? "HOLDING" : "Hold anywhere to bid";
  };

  holdArea.addEventListener("pointerdown", startHolding);

  clearInterval(countdownInterval);
  countdownInterval = setInterval(()=>{
    const remaining=Math.max(0,Math.ceil((endsAt-Date.now())/1000));
    const el=document.getElementById("countdown");
    if(el) el.textContent=remaining;
    if(remaining<=0) clearInterval(countdownInterval);
  },100);
}

function renderAuctionScreen(){
  if(!tappedIn){
    render(`<div class="hint">You did not tap in</div>`);
    return;
  }
  phase="auction";

  render(`
    <div id="holdArea" class="hold ${holding?'holding':''}">
      <div class="big">${holding?'HOLDING':'Hold anywhere to bid'}</div>
    </div>
  `);

  const holdArea=document.getElementById("holdArea");

  const release=()=>{
    if(!holding) return;
    holding=false;
    updateHoldVisual();
    socket.emit("hold_end");
  };

  const updateHoldVisual = () => {
    holdArea.classList.toggle("holding", holding);
    holdArea.querySelector(".big").textContent = holding ? "HOLDING" : "Bid locked";
  };

  // Release on touch up / pointer leave
  holdArea.addEventListener("pointerup", release);
  holdArea.addEventListener("pointercancel", release);
  holdArea.addEventListener("pointerleave", release);
}

function renderRoundEnd(result){
  holding=false;
  tappedIn=false;
  let text="";
  if(result.tie) text="Tie — Token lost";
  else if(result.winner) text=`Winner: ${result.winner}`;
  else text="No bids";
  render(`<div class="big">${text}</div>`);
}

// ---------- SOCKET EVENTS ----------

socket.on("countdown_start", ({endsAt})=>renderCountdown(endsAt));
socket.on("auction_start", ()=>renderAuctionScreen());
socket.on("round_result", result=>renderRoundEnd(result));
socket.on("round_aborted", ()=>render(`<div class="hint">Round aborted — not all tapped in</div>`));

renderLobby();
</script>
</body>
</html>
