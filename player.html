<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Auction – Player</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  html, body {
    margin:0; padding:0; height:100%; width:100%;
    font-family:system-ui,sans-serif;
    background:#0b0b0b; color:#fff;
    user-select:none;
  }

  #tapArea {
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    font-size:2.5rem;
    font-weight:700;
    background:#8b0000;
    cursor:pointer;
    text-align:center;
    touch-action: none; /* prevent default touch scrolling */
  }

  #tapArea.holding {
    background:#ff4500;
  }

  #tapArea.readyToStart {
    background:#8b0000;
  }

  #nameDisplay {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0, 0, 0, 0.6);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    border: 1px solid #333;
    transition: all 0.2s;
  }

  #nameDisplay:hover {
    background: rgba(0, 0, 0, 0.8);
    border-color: #555;
  }

  #nameDisplay span {
    font-weight: 600;
    color: #ffd700;
  }

  #disconnectBtn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: #666;
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
  }

  #disconnectBtn:hover {
    background: #888;
  }

</style>
</head>
<body>

<div id="nameDisplay">Player: <span id="nameText"></span> (tap to change)</div>
<button id="disconnectBtn">Leave Game</button>

<div id="tapArea">Tap anywhere to Join / Ready</div>

<script>
const socket = io("https://time-auction-server-7ijf.onrender.com");

// persistent player ID
let playerId = localStorage.getItem("timeAuctionPlayerId");
if(!playerId){
  playerId = Math.random().toString(36).substring(2,10);
  localStorage.setItem("timeAuctionPlayerId", playerId);
}

let playerName = localStorage.getItem("timeAuctionPlayerName");
if (!playerName) {
  playerName = prompt("Enter your name");
  if (!playerName || !playerName.trim()) {
    playerName = null;
  } else {
    localStorage.setItem("timeAuctionPlayerName", playerName.trim());
    playerName = playerName.trim();
  }
}

function joinGame() {
  if (playerName) {
    socket.emit("join", { id: playerId, name: playerName });
  }
}

socket.on("connect", () => {
  joinGame();
});

joinGame();

function ensureConnected() {
  if (socket.disconnected) {
    socket.connect();
  } else {
    joinGame();
  }
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    ensureConnected();
  }
});

window.addEventListener("focus", ensureConnected);
window.addEventListener("online", ensureConnected);

const tapArea = document.getElementById("tapArea");
const nameText = document.getElementById("nameText");
const nameDisplay = document.getElementById("nameDisplay");

// Display current name
if (playerName) {
  nameText.textContent = playerName;
} else {
  nameDisplay.style.display = "none";
}

// Allow changing name
nameDisplay.addEventListener("click", () => {
  const newName = prompt("Enter your new name:", playerName);
  if (newName && newName.trim()) {
    playerName = newName.trim();
    localStorage.setItem("timeAuctionPlayerName", playerName);
    nameText.textContent = playerName;
    joinGame();
  }
});

// Disconnect button
const disconnectBtn = document.getElementById("disconnectBtn");
disconnectBtn.addEventListener("click", () => {
  if (confirm("Are you sure you want to leave the game?")) {
    socket.emit("player_leave");
    localStorage.removeItem("timeAuctionPlayerId");
    localStorage.removeItem("timeAuctionPlayerName");
    // Wait a moment for the event to be processed before disconnecting
    setTimeout(() => {
      socket.disconnect();
      window.location.reload();
    }, 100);
  }
});

let tappedIn = false;
let holding = false;
let complete = false;
let gamePhase = "lobby";

function updateNameDisplayVisibility() {
  nameDisplay.style.display = gamePhase === "lobby" ? "block" : "none";
  disconnectBtn.style.display = gamePhase === "lobby" ? "block" : "none";
  disconnectBtn.disabled = gamePhase !== "lobby";
}
let remainingMs = 0;
let auctionStartsAt = null;
let holdStartTime = null;
let timeExpireTimeout = null;
let lockedOut = false;

function getEffectiveRemainingMs() {
  if (gamePhase !== "auction" || !auctionStartsAt) return remainingMs;
  
  // Calculate how much time has been used since auction started
  const elapsedSinceAuctionStart = Date.now() - auctionStartsAt;
  
  // If we're holding, add the hold duration
  let timeUsed = elapsedSinceAuctionStart;
  if (holding && holdStartTime) {
    // The hold duration is part of the elapsed time, already counted
    // So we just use the elapsed time
  }
  
  return Math.max(0, remainingMs - timeUsed);
}

function startHold() {
  if (complete || lockedOut) return;

  const effectiveRemaining = getEffectiveRemainingMs();
  if (effectiveRemaining <= 0) return; // Can't hold if no time remaining

  if(!holding){
    holding = true;
    holdStartTime = Date.now();

    if(!tappedIn){
      tappedIn = true;
      socket.emit("tap_in"); // auto tap-in
    }

    tapArea.classList.remove("readyToStart");
    tapArea.classList.add("holding");
    tapArea.textContent = "HOLDING";
    socket.emit("hold_start");
  }
}

function endHold() {
  if (holding) {
    // Clear the time expiry timeout
    if (timeExpireTimeout) {
      clearTimeout(timeExpireTimeout);
      timeExpireTimeout = null;
    }
    
    // If you were holding and let go during an auction:
    //  You lock in your bid and can no longer rejoin the auction
    //  Player screen will be disabled for further presses 
    if (gamePhase === "auction") {
      holding = false;
      complete = true; // prevent further interaction after auction
      tapArea.textContent = "Bid locked";
    }
    else {
      holding = false;
      tappedIn = false; // reset tapped in state
      tapArea.textContent = "Tap anywhere to Join / Ready";
      tapArea.classList.remove("holding");
      tapArea.classList.add("readyToStart");
      socket.emit("tap_out"); // notify server we're no longer tapped in
    }

    socket.emit("hold_end", Date.now());
  }
}

// --- pointer events for press-and-hold ---
tapArea.addEventListener("pointerdown", startHold);
tapArea.addEventListener("pointerup", endHold);
tapArea.addEventListener("pointercancel", endHold);
tapArea.addEventListener("pointerleave", endHold);

// ----------------------------- start experiment

// --- server events ---
// Reset at start of countdown
socket.on("countdown_start", ({ auctionStartsAt })=>{
  tappedIn = false;
  // Don't reset holding - let players keep their hold through countdown
  
  // Show countdown (unless already holding)
  if (!holding) {
    tapArea.classList.remove("holding");
    tapArea.textContent = "Tap anywhere to Join / Ready";
  }

  // Countdown display
  function tick(){
    const remaining = Math.max(0, Math.ceil((auctionStartsAt - Date.now())/1000));
    if (!holding) {
      tapArea.textContent = remaining;
    }
    if (remaining > 0) {
      requestAnimationFrame(tick);
    } else {
      // Countdown finished, wait for auction_start event
      if (!holding) {
        tapArea.textContent = "Starting auction...";
      }
    }
  }
  tick();
});

socket.on("state", state=>{
  gamePhase = state.phase;
  // Find this player in the state and update remaining time
  const thisPlayer = state.players.find(p => p.id === playerId);
  if(thisPlayer) {
    const prevRemainingMs = remainingMs;
    remainingMs = thisPlayer.remainingMs;
    
    // Auto-release hold if time runs out during auction
    if (holding && gamePhase === "auction" && remainingMs <= 0 && prevRemainingMs > 0) {
      endHold();
    }
  }
  updateNameDisplayVisibility();
});


// --------- Game Phases ---------

// Auction start → keep tapArea full-screen hold
socket.on("auction_start", ({auctionStartsAt: startsAt})=>{
  auctionStartsAt = startsAt;
  
  if (!holding) {
    complete = true;
    tapArea.textContent = "Bid locked";
  } else {
    tapArea.textContent = "HOLDING";
  }
  
  // Set a timeout to auto-release hold when time expires
  if (timeExpireTimeout) clearTimeout(timeExpireTimeout);
  
  // Calculate when time will expire: auctionStartsAt + remainingMs
  const timeExpireAt = auctionStartsAt + remainingMs;
  const delayUntilExpire = Math.max(0, timeExpireAt - Date.now());
  
  timeExpireTimeout = setTimeout(() => {
    if (holding && gamePhase === "auction") {
      endHold();
    }
  }, delayUntilExpire);
});


// Round result → show winner, then reset for next round
socket.on("round_result", result=>{
  if (timeExpireTimeout) clearTimeout(timeExpireTimeout);
  
  if(result.tie){
    tapArea.textContent = "TOKEN LOST";
  } else if(result.winner){
    tapArea.textContent = `Winner: ${result.winner}`;
  } else {
    tapArea.textContent = "No bids";
  }
});


// Reset for the round
socket.on("reset_for_round", ()=>{
  tappedIn = false;
  holding = false;
  complete = false;
  lockedOut = false;
  tapArea.classList.remove("holding");
  tapArea.textContent = "Hold anywhere to Join / Ready";
  updateNameDisplayVisibility();
});

socket.on("time_expired", ()=>{
  if (holding) {
    endHold();
  }
  tapArea.textContent = "Time's up!";
});

socket.on("locked_out", () => {
  lockedOut = true;
  complete = true;
  holding = false;

  tapArea.classList.remove("holding");
  tapArea.textContent = "Locked out this round";
});

</script>

</body>
</html>
