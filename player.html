							<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Time Auction – Player</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0b0b;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 24px;
    }

    .hint {
      font-size: 1.2rem;
      opacity: 0.8;
    }

    .big {
      font-size: 2.2rem;
      font-weight: 700;
    }

    .hold {
      background: #1e1e1e;
      border-radius: 20px;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .holding {
      background: #8b0000;
    }

    .countdown {
      font-size: 4rem;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="screen"></div>

  <script>
    const socket = io("https://time-auction-server-7ijf.onrender.com");

    let phase = "lobby";
    let holding = false;

    const screen = document.getElementById("screen");

    function render(content) {
      screen.innerHTML = content;
    }

    function renderLobby() {
      render(`<div class="hint">Waiting for game to start…</div>`);
    }

    function renderCountdown(ms) {
      let remaining = ms / 1000;
      render(`<div class="countdown">${remaining}</div>`);
      const interval = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) clearInterval(interval);
        screen.innerHTML = `<div class="countdown">${Math.max(0, remaining)}</div>`;
      }, 1000);
    }

    function renderAuction() {
      render(`
        <div id="holdArea" class="hold">
          <div class="big">Hold anywhere to bid</div>
        </div>
      `);

      const holdArea = document.getElementById("holdArea");

      holdArea.addEventListener("pointerdown", () => {
        if (holding) return;
        holding = true;
        holdArea.classList.add("holding");
        holdArea.innerHTML = `<div class="big">HOLDING</div>`;
        socket.emit("hold_start");
      });

      function release() {
        if (!holding) return;
        holding = false;
        socket.emit("hold_end");
        holdArea.classList.remove("holding");
        holdArea.innerHTML = `<div class="big">Bid locked</div>`;
      }

      holdArea.addEventListener("pointerup", release);
      holdArea.addEventListener("pointercancel", release);
      holdArea.addEventListener("pointerleave", release);
    }

    function renderRoundEnd(result) {
      if (result.tie) {
        render(`<div class="big">Token lost</div>`);
      } else if (result.winner) {
        render(`<div class="big">Winner: ${result.winner}</div>`);
      } else {
        render(`<div class="big">No bids</div>`);
      }
    }

    // ---- Socket Events ----

    const name = prompt("Enter your name");
    socket.emit("join", name || "Player");

    socket.on("countdown_start", ms => {
      phase = "countdown";
      renderCountdown(ms);
    });

    socket.on("auction_start", () => {
      phase = "auction";
      renderAuction();
    });

    socket.on("round_result", result => {
      phase = "roundEnd";
      renderRoundEnd(result);
    });

    renderLobby();
  </script>


</body></html>
