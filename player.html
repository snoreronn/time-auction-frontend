<script>
  const socket = io("https://time-auction-server-7ijf.onrender.com");

  let phase = "lobby";
  let holding = false;
  let tappedIn = false;

  // Persistent player ID
  let playerId = localStorage.getItem("timeAuctionPlayerId");
  if (!playerId) {
    playerId = Math.random().toString(36).substring(2, 10);
    localStorage.setItem("timeAuctionPlayerId", playerId);
  }

  const screen = document.getElementById("screen");

  function render(content) {
    screen.innerHTML = content;
  }

  // ---------- RENDERS ----------

  function renderLobby() {
    render(`<div class="hint">Waiting for game to start…</div>`);
  }

  function renderTapIn() {
    render(`
      <div>
        <div class="big">Tap in to play</div>
        <br/>
        <button id="tapBtn" style="
          font-size:1.4rem;
          padding:16px 32px;
          border-radius:16px;
          border:none;
          background:#2ecc71;
          color:#000;
        ">Tap In</button>
      </div>
    `);

    document.getElementById("tapBtn").onclick = () => {
      socket.emit("tap_in");
      tappedIn = true;
      render(`<div class="hint">Waiting for others…</div>`);
    };
  }

  function renderCountdown(endsAt) {
    function tick() {
      const remaining = Math.max(
        0,
        Math.ceil((endsAt - Date.now()) / 1000)
      );
      screen.innerHTML = `<div class="countdown">${remaining}</div>`;
      if (remaining > 0) requestAnimationFrame(tick);
    }
    tick();
  }

  function renderAuction() {
    if (!tappedIn) {
      render(`<div class="hint">You did not tap in</div>`);
      return;
    }

    render(`
      <div id="holdArea" class="hold">
        <div class="big">Hold anywhere to bid</div>
      </div>
    `);

    const holdArea = document.getElementById("holdArea");

    holdArea.addEventListener("pointerdown", () => {
      if (holding) return;
      holding = true;
      holdArea.classList.add("holding");
      holdArea.innerHTML = `<div class="big">HOLDING</div>`;
      socket.emit("hold_start");
    });

    function release() {
      if (!holding) return;
      holding = false;
      socket.emit("hold_end");
      holdArea.classList.remove("holding");
      holdArea.innerHTML = `<div class="big">Bid locked</div>`;
    }

    holdArea.addEventListener("pointerup", release);
    holdArea.addEventListener("pointercancel", release);
    holdArea.addEventListener("pointerleave", release);
  }

  function renderRoundEnd(result) {
    tappedIn = false;
    holding = false;

    if (result.tie) {
      render(`<div class="big">Tie — token lost</div>`);
    } else if (result.winner) {
      render(`<div class="big">Winner: ${result.winner}</div>`);
    } else {
      render(`<div class="big">No bids</div>`);
    }
  }

  // ---------- SOCKET EVENTS ----------

  const name = prompt("Enter your name") || "Player";
  socket.emit("join", { id: playerId, name });

  socket.on("countdown_start", ({ endsAt }) => {
    phase = "countdown";
    tappedIn = false;
    renderTapIn();
    renderCountdown(endsAt);
  });

  socket.on("auction_start", () => {
    phase = "auction";
    renderAuction();
  });

  socket.on("round_result", result => {
    phase = "roundEnd";
    renderRoundEnd(result);
  });

  socket.on("round_aborted", () => {
    phase = "lobby";
    tappedIn = false;
    render(`<div class="hint">Round aborted — not all tapped in</div>`);
  });

  renderLobby();
</script>
