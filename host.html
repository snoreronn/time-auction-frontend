<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Auction – Host</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0b0b0b;
    color: #fff;
  }
  header {
    padding: 16px;
    background: #111;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #222;
  }
  button {
    background: #8b0000;
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .container {
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .card {
    background: #151515;
    border-radius: 12px;
    padding: 16px;
  }
  .card h2 { margin-top:0; font-size:1.2rem; }
  .players li {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #222;
  }
  .tag { font-size: 0.8rem; opacity:0.7; }
  .countdown { font-size:3rem; font-weight:800; text-align:center; }
  .winner { font-size:2rem; font-weight:700; text-align:center; color:#ffd700; }

  .player-details.holding { color: #ff5555; font-weight: 700; }

  .hide-details .player-details {
    display: none;
  }

</style>
</head>
<body>

<header>
  <div>
    <strong>Time Auction – Host</strong><br>
    <span id="phase">Phase: lobby</span>
  </div>
  <div>
    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
      <input type="checkbox" id="hideDetailsCheckbox">
      Hide player details
    </label>
    <button id="gameStartBtn">Start Game</button>
    <button id="roundResetBtn">Reset Round</button>
    <button id="roundStartBtn">Start Round</button>
    <button id="restartBtn">Restart Game</button>
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>Players</h2>
    <ul id="players" class="players"></ul>
  </div>

  <div class="card">
    <h2>Round Status</h2>
    <div id="roundInfo" class="countdown">—</div>
    <div id="winner" class="winner"></div>
  </div>

</div>

<script>
const socket = io("https://time-auction-server-7ijf.onrender.com");

const playersEl = document.getElementById("players");
const phaseEl = document.getElementById("phase");
const roundInfo = document.getElementById("roundInfo");
const winnerEl = document.getElementById("winner");
const roundStartBtn = document.getElementById("roundStartBtn");
const gameStartBtn = document.getElementById("gameStartBtn");
const roundReadyBtn = document.getElementById("roundReadyBtn");

let countdownInterval = null;
let currentPlayers = [];

// Render player list with holding & tapped in
function renderPlayers(players){
  playersEl.innerHTML="";
  currentPlayers = players; // keep for checking tap-in
  players.forEach(p=>{
    const li = document.createElement("li");
    const remainingStr = p.remainingMs !== null ? Math.floor(p.remainingMs / 1000) + "s" : "—";

    li.innerHTML = `
      <span>${p.name}</span>
      <span class="player-details tag">
        (${p.tokens} tokens) • ${remainingStr}
        ${p.tappedIn ? " • Tapped In" : ""} 
        ${p.holding ? " • HOLDING" : ""}
      </span>
    `;

    const details = li.querySelector(".player-details");
    if (p.holding && details) {
      details.classList.add("holding");
    }
    playersEl.appendChild(li);
  });

  // Enable Start Round button only if all players tapped in (playersReady)
  roundStartBtn.disabled = gamePhase != "playersReady";
}

// Countdown timer
function renderCountdown( auctionStartsAt ){
  clearInterval(countdownInterval);
  function tick(){
    const remaining = Math.max(0, Math.ceil((auctionStartsAt-Date.now())/1000));
    roundInfo.textContent = remaining;
    if(remaining>0) requestAnimationFrame(tick);
  }
  tick();
}

function resetDashboard(){
  roundInfo.textContent="—";
  winnerEl.textContent="";
}

socket.on("state", state=>{
  gamePhase = state.phase;
  phaseEl.textContent = `Phase: ${state.phase} | Round ${state.round}`;
  renderPlayers(state.players);
});

socket.on("countdown_start", ({ auctionStartsAt })=>{
  winnerEl.textContent="";
  renderCountdown(auctionStartsAt);
});

socket.on("auction_start", ()=>{
  roundInfo.textContent="AUCTION LIVE";
});

socket.on("round_result", result=>{
  if(result.tie) winnerEl.textContent="TOKEN LOST";
  else if(result.winner) winnerEl.textContent=`Winner: ${result.winner}`;
  else winnerEl.textContent="No bids";
});

// ----------------- Host Buttons -----------------
gameStartBtn.onclick = ()=>{
  socket.emit("host_start_game");
  winnerEl.textContent="";
};
roundStartBtn
.onclick = ()=>{
  socket.emit("host_start_round");
  winnerEl.textContent="";
};
roundResetBtn.onclick = ()=>{
  resetDashboard();
  socket.emit("host_reset_for_round");
  winnerEl.textContent="";
};
document.getElementById("restartBtn").onclick = ()=>{
  resetDashboard();
  fetch("https://time-auction-server-7ijf.onrender.com/restart")
    .then(()=>{ winnerEl.textContent=""; });
};

const hideDetailsCheckbox = document.getElementById("hideDetailsCheckbox");

hideDetailsCheckbox.addEventListener("change", () => {
  document.body.classList.toggle(
    "hide-details",
    hideDetailsCheckbox.checked
  );
});
</script>

</body>
</html>
